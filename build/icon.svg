<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0b1220" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- rounded-square app tile -->
  <rect x="72" y="72" width="880" height="880" rx="200" ry="200" fill="url(#bg)"/>

  <!-- Kubernetes-style helm wheel -->
  <g transform="translate(512 512)" filter="url(#ds)">
    <g fill="url(#wheel)" stroke="url(#wheel)" stroke-linejoin="round" stroke-linecap="round">
      <!-- outer heptagon ring -->
      <polygon points="0,-300 234,-130 190,150 0,300 -190,150 -234,-130 0,-300"
               fill="none" stroke="url(#wheel)" stroke-width="34"/>
      <!-- hub -->
      <circle cx="0" cy="0" r="70"/>
      <!-- seven spokes -->
      <g stroke="url(#wheel)" stroke-width="30">
        <line x1="0" y1="-70" x2="0" y2="-250"/>
        <line x1="60" y1="-38" x2="205" y2="-118"/>
        <line x1="68" y1="30" x2="168" y2="128"/>
        <line x1="35" y1="61" x2="82" y2="250"/>
        <line x1="-35" y1="61" x2="-82" y2="250"/>
        <line x1="-68" y1="30" x2="-168" y2="128"/>
        <line x1="-60" y1="-38" x2="-205" y2="-118"/>
      </g>
    </g>
  </g>
</svg>
